<title>Call Sheet Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Barlow:wght@400;500;600;700&family=Chivo+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a coordinator's laminated call sheet, with a stadium scoreboard pinned on top */
:root {
  --paper: #EBEFEA;
  --card: #FAFBF9;
  --ink: #14201A;
  --muted: #56655C;
  --line: #C8D2CA;
  --turf: #2E6B3F;
  --turf-dark: #275E36;
  --chalk: rgba(255,255,255,.55);
  --firstdown: #E5B925;
  --board: #11201A;
  --board-ink: #EEF3EE;
  --board-dim: #8FA596;
  --good: #1E7845;
  --bad: #B2342A;
  --focus: #1F5FBF;
  --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Chivo Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1310; --card: #151F1A; --ink: #E3EBE5; --muted: #93A399; --line: #2B3A31;
    --turf: #255834; --turf-dark: #1F4D2C; --chalk: rgba(255,255,255,.4); --firstdown: #E5B925;
    --board: #050A07; --board-ink: #EEF3EE; --board-dim: #7D9184;
    --good: #4FB57A; --bad: #E56D60; --focus: #86B4FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1310; --card: #151F1A; --ink: #E3EBE5; --muted: #93A399; --line: #2B3A31;
  --turf: #255834; --turf-dark: #1F4D2C; --chalk: rgba(255,255,255,.4); --firstdown: #E5B925;
  --board: #050A07; --board-ink: #EEF3EE; --board-dim: #7D9184;
  --good: #4FB57A; --bad: #E56D60; --focus: #86B4FF; color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-inline: 16px; padding-block: 12px 40px;
}
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }

/* Scoreboard */
.board {
  background: var(--board); color: var(--board-ink);
  border-radius: 10px; padding: 12px 14px 10px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px 10px;
  font-variant-numeric: tabular-nums;
}
.bteam { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bteam.right { flex-direction: row-reverse; text-align: right; }
.bteam .id { min-width: 0; display: grid; }
.bteam .abbr { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .04em; display: flex; align-items: center; gap: 6px; }
.bteam.right .abbr { justify-content: flex-end; }
.bteam .full { font-size: 12px; color: var(--board-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bteam .pts { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: .9; margin-left: auto; }
.bteam.right .pts { margin-left: 0; margin-right: auto; }
.tos { display: flex; gap: 4px; margin-top: 4px; }
.bteam.right .tos { justify-content: flex-end; }
.tos i { width: 12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.18); }
.tos i.on { background: var(--firstdown); }
.clockbox { border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 10px; background: var(--paper); }
.clockbox .cstat { font-family: var(--mono); font-size: 13px; }
.clockbtns { display: flex; flex-wrap: wrap; gap: 8px; }
.clockbtns .btn.ghost { width: auto; flex: 1 1 140px; font-size: 16px; padding: 9px 10px; }
.clockbtns .btn.ghost[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.stripe { width: 6px; align-self: stretch; border-radius: 3px; background: var(--team); flex: none; }
.ballmark { width: 14px; height: 9px; border-radius: 50%; background: #9A5A2B; box-shadow: inset 0 0 0 1.5px #E9D8C4; flex: none; }
.bmid { display: grid; justify-items: center; padding-inline: 4px; }
.bmid .q { font-family: var(--mono); font-size: 12px; color: var(--board-dim); letter-spacing: .08em; }
.bmid .clk { font-family: var(--display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--firstdown); }
.board .sit { grid-column: 1 / -1; border-top: 1px solid rgba(255,255,255,.12); padding-top: 8px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-family: var(--mono); font-size: 13px; }
.board .sit b { font-weight: 500; color: var(--board-ink); }
.board .sit span { color: var(--board-dim); }

/* Field */
.field { position: relative; height: 68px; border-radius: 6px; overflow: hidden; background: var(--turf); }
.field .turf { position: absolute; inset: 0 8.333%; background:
  repeating-linear-gradient(90deg, var(--chalk) 0 1.5px, transparent 1.5px 10%),
  repeating-linear-gradient(90deg, var(--turf) 0 10%, var(--turf-dark) 10% 20%); }
.field .turf::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 1.5px; background: var(--chalk); }
.ez { position: absolute; top: 0; bottom: 0; width: 8.333%; background: var(--team); display: grid; place-items: center; }
.ez span { writing-mode: vertical-rl; font-family: var(--display); font-weight: 800; font-size: 13px; letter-spacing: .12em; color: #fff; }
.ez.l { left: 0; } .ez.l span { transform: rotate(180deg); }
.ez.r { right: 0; }
.yn { position: absolute; bottom: 4px; transform: translateX(-50%); font-family: var(--display); font-weight: 600; font-size: 12px; color: rgba(255,255,255,.75); }
.mk { position: absolute; top: 0; bottom: 0; width: 3px; transform: translateX(-50%); }
.mk.los { background: #3E8EEA; }
.mk.fd { background: var(--firstdown); }
.ball { position: absolute; top: 40%; width: 16px; height: 10px; transform: translate(-50%, -50%); border-radius: 50%; background: #8D4F22; box-shadow: inset 0 0 0 1.5px #EBDCC7, 0 1px 3px rgba(0,0,0,.5); transition: left .7s cubic-bezier(.2,.8,.2,1); }
.trail { position: absolute; top: 40%; height: 4px; transform: translateY(-50%); background: rgba(255,255,255,.55); border-radius: 2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 5px; }

/* Panels */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 14px; }
.banner { border-left: 4px solid var(--firstdown); background: var(--card); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 15px; }

/* Buttons */
.btn { appearance: none; border: 0; border-radius: 8px; padding: 14px 18px; font-family: var(--display); font-weight: 800; font-size: 21px; letter-spacing: .03em; text-transform: uppercase; background: var(--ink); color: var(--paper); width: 100%; }
.btn.team { background: var(--team); color: #fff; }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); font-size: 17px; padding: 10px 14px; }
.linkbtn { appearance: none; background: none; border: 0; padding: 6px 0; font-family: var(--mono); font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.linkbtn.warn { color: var(--bad); }

/* Setup */
.masthead { display: grid; gap: 6px; padding-block: 8px 4px; }
.masthead h1 { font-size: clamp(44px, 13vw, 64px); text-transform: uppercase; }
.masthead h1 em { font-style: normal; color: var(--turf); }
.teamcfg { display: grid; gap: 12px; border-top: 6px solid var(--team); }
.teamcfg label { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.teamcfg input[type=text] { width: 100%; font: 600 20px var(--body); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; background: var(--c); box-shadow: inset 0 0 0 2px var(--card); }
.sw[aria-pressed="true"] { border-color: var(--ink); }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; appearance: none; border: 0; background: transparent; padding: 10px 6px; font-weight: 600; font-size: 15px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.codein { flex: 1 1 0; width: 0; min-width: 0; font: 600 20px var(--mono); letter-spacing: .2em; text-transform: uppercase; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.bigcode { font-family: var(--display); font-weight: 800; font-size: clamp(64px, 22vw, 96px); letter-spacing: .08em; line-height: 1; }
.linkline { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.vs .side { border-top: 5px solid var(--team); background: var(--card); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.vs .side .nm { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; line-height: 1.05; overflow-wrap: anywhere; }
.vs .at { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }

/* Handoff */
.handoff { border-top: 8px solid var(--team); text-align: left; padding-block: 28px; }
.handoff h2 { font-size: clamp(34px, 10vw, 46px); text-transform: uppercase; }
.handoff h2 span { color: var(--team); filter: saturate(1.1); }

/* Call sheet */
.callhead { display: grid; gap: 6px; }
.callhead h2 { font-size: 34px; text-transform: uppercase; }
.plays { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pkgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pkgs.two { grid-template-columns: 1fr 1fr; }
.pkg { appearance: none; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; }
.pkg .pn { font-family: var(--display); font-weight: 800; font-size: 17px; text-transform: uppercase; line-height: 1.05; }
.pkg .pw { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.pkg[aria-pressed="true"] { border-color: var(--team); box-shadow: inset 0 0 0 2px var(--team); background: color-mix(in srgb, var(--team) 10%, var(--card)); }
.pkdesc { font-size: 14px; margin-top: -6px; }
.callchip .pk { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 2px; }
@media (max-width: 380px) { .pkgs { grid-template-columns: 1fr 1fr; } }
@media (max-width: 380px) { .plays { grid-template-columns: 1fr; } }
.play { appearance: none; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 4px; align-content: start; min-width: 0; }
.play .tag { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.play .nm { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; text-transform: uppercase; }
.play .ds { font-size: 14px; color: var(--muted); line-height: 1.3; }
.play[aria-pressed="true"] { border-color: var(--team); box-shadow: inset 0 0 0 2px var(--team); background: color-mix(in srgb, var(--team) 10%, var(--card)); }
.play.st { border-style: dashed; }
.sechead { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.lockbar { position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--paper) 70%, transparent); }

/* Result */
.calls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.callchip { border: 1.5px solid var(--line); border-top: 5px solid var(--team); border-radius: 8px; padding: 10px 12px; background: var(--card); min-width: 0; }
.callchip .who { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.callchip .nm { font-family: var(--display); font-weight: 800; font-size: 22px; text-transform: uppercase; line-height: 1.05; }
.headline { font-family: var(--display); font-weight: 800; font-size: clamp(52px, 17vw, 84px); line-height: .9; text-transform: uppercase; animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
.headline.good { color: var(--good); } .headline.bad { color: var(--bad); }
@keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: none; opacity: 1; } }
.read { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); justify-self: start; }
.read i { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.read.o i { background: var(--good); } .read.d i { background: var(--bad); }
.narr { font-size: 18px; }
.next { font-family: var(--mono); font-size: 14px; }

/* At the line (audibles) */
.lookcard { border: 1.5px solid var(--line); border-left: 6px solid var(--bad); border-radius: 8px; padding: 12px 14px; background: var(--card); display: grid; gap: 4px; }
.lookcard .lk { font-family: var(--display); font-weight: 800; font-size: 26px; line-height: 1.05; text-transform: uppercase; }
.lookcard .lh { font-size: 15px; }
.mycall { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; border: 1.5px solid var(--team); border-radius: 8px; padding: 10px 14px; background: color-mix(in srgb, var(--team) 8%, var(--card)); }
.mycall .nm { font-family: var(--display); font-weight: 800; font-size: 24px; text-transform: uppercase; line-height: 1.05; }
.lockbar.two { display: grid; gap: 8px; }
.audnote { font-size: 15px; border-left: 4px solid var(--focus); padding: 6px 10px; background: var(--paper); border-radius: 0 6px 6px 0; }

/* PAT + final */
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.final h2 { font-size: clamp(40px, 12vw, 58px); text-transform: uppercase; }

/* Log + box score */
details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
summary { cursor: pointer; padding: 12px 16px; font-family: var(--display); font-weight: 800; font-size: 20px; text-transform: uppercase; letter-spacing: .02em; }
.log { list-style: none; margin: 0; padding: 0 16px 12px; display: grid; gap: 0; max-height: 420px; overflow-y: auto; }
.log li { border-top: 1px solid var(--line); padding-block: 9px; display: grid; gap: 2px; font-size: 14px; }
.log .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.log .cl { font-family: var(--mono); font-size: 12px; }
.log .tm { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--team); margin-right: 6px; }
.tablewrap { overflow-x: auto; padding: 0 16px 14px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 14px; }
th, td { padding: 7px 6px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-top: 0; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.topbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: -6px; }
.soundbtn { appearance: none; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px 5px 10px; font-family: var(--mono); font-size: 12px; color: var(--ink); }
.soundbtn svg { width: 16px; height: 16px; }
.soundbtn[aria-pressed="false"] { color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .headline { animation: none; } .ball { transition: none; } }
</style>

<script>
(function () {
  "use strict";
  const KEY = "callsheet-football-v1";

  /* ---------- Playbook ---------- */
  const OFF_IDS = ["ir", "or", "sc", "sp", "dp", "pa"];
  const DEF_IDS = ["rb", "ba", "ma", "zo", "pr", "ab"];
  const OFFP = {
    ir: { name: "Inside Run", kind: "run", tag: "Run", desc: "Downhill between the tackles. Steady and low risk.", mean: 3.8, sd: 2.8, tfl: .08, big: .025, fum: .012, oob: .04 },
    or: { name: "Outside Zone", kind: "run", tag: "Run", desc: "Stretch to the edge. Boom or bust.", mean: 4.0, sd: 5, tfl: .15, big: .05, fum: .015, oob: .35 },
    sc: { name: "Screen", kind: "pass", tag: "Pass", desc: "Let the rush come, then dump it off behind it.", comp: .80, mean: 5, sd: 4.5, min: -3, int: .012, sack: .02, air: 0 },
    sp: { name: "Quick Game", kind: "pass", tag: "Pass", desc: "Slants and outs. Moves the chains.", comp: .66, mean: 7, sd: 3, min: 1, int: .022, sack: .04, air: 6 },
    dp: { name: "Deep Shot", kind: "pass", tag: "Pass", desc: "Go routes and posts. Big gain or nothing.", comp: .38, mean: 27, sd: 9, min: 13, int: .045, sack: .07, air: 22, deep: 1 },
    pa: { name: "Play-Action", kind: "pass", tag: "Pass", desc: "Sell the run, then throw over the top.", comp: .54, mean: 16, sd: 7, min: 6, int: .03, sack: .06, air: 14, deep: 1 },
    so: { name: "Sideline Route", kind: "pass", tag: "Clock", desc: "Out route to the boundary. Short gain, but the receiver usually gets out of bounds to stop the clock.", comp: .6, mean: 6, sd: 2.5, min: 2, int: .025, sack: .045, air: 7, oob: .85, noBig: true },
    te: { name: "Tackle Eligible", kind: "pass", tag: "Trick", desc: "Jumbo only. Throw to the tackle who reported eligible. Short, but a shock.", comp: .74, mean: 4, sd: 2.5, min: 1, int: .02, sack: .03, air: 3, noBig: true }
  };
  const DEFP = {
    rb: { name: "Run Blitz", tag: "Front", desc: "Crash the gaps. Stuffs runs, exposed to play-action." },
    ba: { name: "Base 4-3", tag: "Front", desc: "Balanced look. No big holes, no big wins." },

    ab: { name: "All-Out Blitz", tag: "Pressure", desc: "Send everyone. Sack or get burned." },

  const LOOKS = {

    ba: { name: "Even front, one high safety", hint: "Balanced. Doesn't tip much either way." },
    ma: { name: "Press corners", hint: "Corners up in the receivers' faces. Often man coverage." },
    zo: { name: "Two high safeties", hint: "Deep help on both sides. Often Cover 2." },

  function doPAT(kind, dist) {
    if (kind === "two") { startTwo(); return; }
    const t = S.patTeam, d = dist || 33;
    const ok = rand() < (dist ? fgProb(d) : .94);
    if (ok) score(t, 1);
    const ko = kickAfterScore(t);
    const r = { read: null, team: t, offId: "xp", defId: null, fromX: fx(t, 118 - d), toX: fx(t, ok ? 110 : 98),
      head: ok ? "Extra point good" : "Extra point missed", tone: ok ? "good" : "bad",
      text: dist ? (ok ? `The ${d}-yard extra point is good.` : `The ${d}-yard extra point is no good.`) : (ok ? "The extra point is through." : "The extra point clanks off the upright."),
      sub: ko, pat: true };
    otTail(r);
    r.id = S.playId = (S.playId || 0) + 1;
    finishClock(r, true);
    S.last = r; S.phase = "result";
    S.log.unshift({ q: S.quarter, clock: S.clock, team: t, sit: "Extra point", off: "Kick", def: "", text: r.text, score: `${S.teams[0].score}-${S.teams[1].score}` });
  }

  /* ---------- Computer coordinator ---------- */
  const RUN_BIAS = 3.3;
  function cpuOffPkg() {
    const diff = S.teams[S.poss].score - S.teams[1 - S.poss].score, late = S.quarter >= 4 && S.clock <= 180;
    if (S.twoPt) return wpick({ p11: 2, p12: 2, p13: 1, jumbo: 1, p10: 1 });
    if (S.toGo <= 1) return wpick({ jumbo: 3, p13: 2, p21: 2, p12: 1 });
    if (late && diff < 0) return wpick({ p10: 3, p11: 4 });
    if (S.toGo <= 3) return wpick({ p12: 3, p21: 2, p13: 1, p11: 2, jumbo: .5 });
    if (S.toGo >= 8) return wpick({ p10: 3, p11: 5, p12: 1 });
    return wpick({ p11: 5, p12: 2, p21: 1, p10: 1, p13: .7 });
  }
  function cpuDefPkg() {
    const w = ({ p10: { dime: 3, nickel: 3, base: .3 }, p11: { nickel: 5, base: 1.5, dime: 1 }, p12: { base: 4, nickel: 2 },
      p21: { base: 5, nickel: 1 }, p13: { base: 4, goal: 1 }, jumbo: { goal: 3, base: 2 } })[S.offPkg || "p11"];
    const x = Object.assign({ base: 0, nickel: 0, dime: 0, goal: 0 }, w);
    if (S.toGo >= 8) { x.dime += 2; x.nickel += 1; x.goal = 0; }
    if (S.spot >= 95 || S.twoPt) x.goal += 2;
    if (S.toGo <= 1) x.goal += 1.5;
    return wpick(x);
  }
  // Scale play weights by how well each play suits the chosen package
  function fitWeights(w) {
    const f = PKG_FIT[S.offPkg] || {};
    Object.keys(w).forEach(k => { w[k] *= Math.max(.12, 1 + .45 * (f[k] || 0)); });
    if (S.offPkg === "jumbo") w.te = 1.2;
    return w;
  }
  function cpuOff() {
    if (S.twoPt) return wpick(fitWeights({ ir: 4, or: 1.5, sc: 1, sp: 3.5, dp: .3, pa: 2 }));
    if (kneelAvailable()) {
      const lead = S.teams[S.poss].score - S.teams[1 - S.poss].score;
      if (lead > 0 || (lead === 0 && S.spot < 50)) return "kneel";
    }
    const me = S.poss, diff = S.teams[me].score - S.teams[1 - me].score;
    const late = S.quarter >= 4 && S.clock <= 180;
    const kd = kickDist();
    const needTD = late && diff < -3;
    if (fgAvailable() && S.down < 4 && !needTD && kd <= 55) return "fg";
    if (S.down === 4) {
      if (!needTD && kd <= 52 && (S.toGo > 2 || kd <= 35)) return "fg";
      const goForIt = (late && diff < 0) || (S.toGo <= 1 && S.spot >= 45) || (S.spot >= 65 && S.toGo <= 3 && kd > 52);
      if (!goForIt) {
        // A rare fake when it's short yardage
        if (S.toGo <= 4 && rand() < .04) return S.spot < 62 || kd > 58 ? "fp" : "ffg";
        if (S.spot < 62) return "punt";
        if (kd <= 58 && !needTD) return "fg";
        if (S.toGo > 4) return "punt";
      }
    }
    const w = { ir: 3, or: 2, sc: 1.5, sp: 3, dp: 1.5, pa: 2 };
    if (S.toGo >= 8) { w.ir = 1; w.or = 1; w.sc += 1; w.sp += 2; w.dp += 2; w.pa += 1; }
    if (S.toGo <= 2) { w.ir += 3; w.or += 1; w.dp = .7; }
    if (S.spot >= 88) { w.dp = .3; w.ir += 1; }
    if (late && diff < 0) { w.ir = .5; w.or = .5; w.dp += 2; w.sp += 1; }
    // Sideline routes when the clock matters: heavily when trailing late, sometimes before the half
    if (sidelineOK()) w.so = (late && diff <= 0) || (S.quarter >= 5 && diff <= 0) ? 3.5 : S.quarter === 2 ? 1.5 : .5;
    fitWeights(w);
    // Lean on the run: tuned so the computer runs on about 40% of its play calls
    w.ir *= RUN_BIAS; w.or *= RUN_BIAS;
    return wpick(w);
  }
  function cpuDef() {
    // 4th down with a kick likely: often send out the return or block unit
    if (S.down === 4 && (puntAvailable() || fgAvailable()) && !(S.toGo <= 2 && S.spot >= 40)) {
      const x = rand();
      if (puntAvailable() && S.spot < 62) { if (x < .55) return "ret"; if (x < .67) return "blk"; }
      else if (fgAvailable() && x < .15) return "blk";
    }
    const w = { rb: 2, ba: 3, ma: 2, zo: 2, pr: 1, ab: 1 };
    if (S.toGo >= 8) { w.rb = .7; w.pr = 2.5; w.zo = 3; w.ab = 1.5; }
    if (S.toGo <= 2) { w.rb = 4; w.ba = 3; w.pr = .3; }
    if (S.spot >= 88) { w.pr = .2; w.ab = 2; }
    // Sit on the sideline when the offense needs to stop the clock
    if (sidelineOK() && S.teams[S.poss].score <= S.teams[1 - S.poss].score && (S.quarter >= 4 || S.quarter === 2)) w.zo += 1.5;

  }
  function cpuPAT() {
    const t = S.patTeam, diff = S.teams[t].score - S.teams[1 - t].score;

  }

  function field(opts) {
    const t = S.teams, pct = x => ((10 + clamp(x, -9, 109)) / 120 * 100).toFixed(2) + "%";

  function clockBox() {

  /* ---------- Sound ---------- */
  // All sounds are synthesized in the browser. No audio files.
  const Sound = (() => {
    let ctx = null, master = null, amb = null, hornBus = null, noiseBuf = null, muted = false;
    try { muted = localStorage.getItem("callsheet-sound") === "off"; } catch (e) {}
    function ac() {
      if (typeof window === "undefined") return null;
      if (!ctx) {
        const C = window.AudioContext || window.webkitAudioContext;
        if (!C) return null;
        try { ctx = new C(); } catch (e) { return null; }
        // Signal chain: crowd/whistles (amb) and horn each feed a compressor, so loud moments stay clean
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = .005; comp.release.value = .25;
        master = ctx.createGain(); master.gain.value = .95;
        comp.connect(master); master.connect(ctx.destination);
        amb = ctx.createGain(); amb.gain.value = 1; amb.connect(comp);
        hornBus = ctx.createGain(); hornBus.gain.value = 1; hornBus.connect(comp);
      }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }
    function noise() {
      if (noiseBuf) return noiseBuf;
      const len = ctx.sampleRate * 4, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = .99765 * b0 + w * .099046; b1 = .963 * b1 + w * .2965164; b2 = .57 * b2 + w * 1.0526913;
        d[i] = (b0 + b1 + b2 + w * .1848) * .16;
      }
      return (noiseBuf = b);
    }
    function env(g, t, a, peak, hold, rel) {
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(peak, t + a);
      g.gain.setValueAtTime(peak, t + a + hold);
      g.gain.exponentialRampToValueAtTime(.0001, t + a + hold + rel);
      return t + a + hold + rel + .05;
    }
    function noiseSrc(t, end) { const s = ctx.createBufferSource(); s.buffer = noise(); s.loop = true; s.start(t, Math.random() * 3); s.stop(end); return s; }
    function filt(type, f, q) { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q == null ? .7 : q; return n; }
    function pan(v) {
      if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = v; return p; }
      return ctx.createGain();
    }
    const R = (a, b) => a + Math.random() * (b - a);

    // Crowd sizes. Each layer adds realism: a wide noise "wash", low rumble, dozens of individual voices, claps and fan whistles.
    const CROWD = {
      roar:   { a: .35, peak: .9,  hold: 3.4, rel: 2.4, rumble: .6, voices: 34, vox: .03,  claps: 140, fanWhistles: 4, rise: 1.18, vowel: [750, 1250] },
      cheer:  { a: .3,  peak: .65, hold: 1.5, rel: 1.6, rumble: .35, voices: 22, vox: .026, claps: 70, fanWhistles: 2, rise: 1.12, vowel: [750, 1250] },
      light:  { a: .25, peak: .32, hold: .7,  rel: 1.0, rumble: .1, voices: 9,  vox: .02,  claps: 25, fanWhistles: 0, rise: 1.06, vowel: [700, 1150] },
      murmur: { a: .25, peak: .16, hold: .4,  rel: .8,  rumble: .08, voices: 0, vox: 0,    claps: 0,  fanWhistles: 0, rise: 1,   vowel: [500, 900] },
      groan:  { a: .22, peak: .42, hold: .9,  rel: 1.4, rumble: .25, voices: 22, vox: .026, claps: 0,  fanWhistles: 0, rise: .78, vowel: [430, 780] }
    };

    const fx = {
      whistle(t, len) {
        len = len || .4;
        const o = ctx.createOscillator(), lfo = ctx.createOscillator(), lg = ctx.createGain(), g = ctx.createGain(), bp = filt("bandpass", 3000, 3);
        o.type = "triangle"; o.frequency.value = 2950;
        lfo.frequency.value = 26; lg.gain.value = 140; lfo.connect(lg); lg.connect(o.frequency);
        o.connect(bp); bp.connect(g); g.connect(amb);
        const end = env(g, t, .015, .2, len, .06);
        o.start(t); lfo.start(t); o.stop(end); lfo.stop(end);
      },
      crowd(t, kind) {
        const s = CROWD[kind]; if (!s) return;
        const total = s.a + s.hold + s.rel;
        // 1. Wide wash, split left and right
        [-.7, .7].forEach(p => {
          const g = ctx.createGain(), bp = filt("bandpass", R(800, 1100), .5), pn = pan(p);
          const end = env(g, t + R(0, .08), s.a, s.peak * .5, s.hold, s.rel);
          noiseSrc(t, end).connect(bp); bp.connect(g); g.connect(pn); pn.connect(amb);
          const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.frequency.value = R(2, 5); lg.gain.value = s.peak * .12;
          lfo.connect(lg); lg.connect(g.gain); lfo.start(t); lfo.stop(end);
        });
        // 2. Low rumble (stadium body)
        if (s.rumble) {
          const g = ctx.createGain(), lp = filt("lowpass", 260, .7);
          const end = env(g, t, s.a * 1.3, s.rumble, s.hold, s.rel);
          noiseSrc(t, end).connect(lp); lp.connect(g); g.connect(amb);
        }
        // 3. Individual voices shaped into a vowel ("yeahhh" rising, "ohhh" falling)
        if (s.voices) {
          const f1 = filt("bandpass", s.vowel[0], 3.5), f2 = filt("bandpass", s.vowel[1], 4), vg = ctx.createGain();
          f1.connect(vg); f2.connect(vg); vg.connect(amb);
          const vend = env(vg, t, s.a, 1, s.hold, s.rel);
          for (let i = 0; i < s.voices; i++) {
            const o = ctx.createOscillator(), og = ctx.createGain(), pn = pan(R(-.9, .9));
            const f0 = Math.random() < .55 ? R(110, 190) : R(200, 360), st = t + R(0, .35);
            o.type = "sawtooth";
            o.frequency.setValueAtTime(f0, st);
            o.frequency.exponentialRampToValueAtTime(f0 * s.rise * R(.97, 1.03), st + s.a + s.hold * .6);
            const vib = ctx.createOscillator(), vgn = ctx.createGain(); vib.frequency.value = R(4.5, 7); vgn.gain.value = f0 * .015;
            vib.connect(vgn); vgn.connect(o.frequency);
            og.gain.value = s.vox * R(.6, 1.2);
            o.connect(og); og.connect(pn); pn.connect(f1); pn.connect(f2);
            const stop = Math.min(vend, st + total * R(.75, 1.05));
            o.start(st); vib.start(st); o.stop(stop); vib.stop(stop);
          }
        }
        // 4. Claps scattered across the reaction

        const url = inviteLink(NET.code), text = `Play Call Sheet Football with me. Game code ${NET.code}`;
        if (typeof navigator !== "undefined" && navigator.share) { navigator.share({ title: "Call Sheet Football", text, url }).catch(() => {}); return; }
        try { navigator.clipboard.writeText(url).then(() => { NET.copied = true; render(); }); } catch (e) {}
        return;
      }
      case "netback": case "netleave": {
        netDisconnect(); setUrl(null); NET.err = null;
        S = loadSaved() || { v: 1, phase: "setup", draft: defaultDraft() };
        if (S.phase !== "setup") S = { v: 1, phase: "setup", draft: S.cfg ? JSON.parse(JSON.stringify(S.cfg)) : defaultDraft() };
        break;
      }
      default: return;
    }
    render(); if (typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, 0);
  }

  /* ---------- Online screens ---------- */
  const qlenLabel = q => `${Math.round(q / 60)}-minute`;
  function callName(id) {
    return ({ punt: "Punt", fg: "Field goal", kneel: "Kneel down", fp: "Fake punt", ffg: "Fake field goal" })[id] || (OFFP[id] ? OFFP[id].name : DEFP[id] ? DEFP[id].name : "");
  }
  function vNetCreate() {
    const d = S.draft;
    return `
      <div class="masthead">
        <p class="eyebrow">Online game</p>
        <h1>Your <em>team</em></h1>
        <p class="muted">You'll be the home team. Your friend sets up their own team when they join.</p>
      </div>
      ${NET.err ? `<p class="banner">${esc(NET.err)}</p>` : ""}
      ${teamCfgHtml(d, 0, { label: "Your team", noCtrl: true })}
      <section class="panel">${gameOptsHtml(d)}</section>
      <button class="btn" data-a="netgo" ${NET.busy ? "disabled" : ""}>${NET.busy ? "Creating game..." : "Create game"}</button>
      <div class="foot"><button class="linkbtn" data-a="netback">Back</button></div>`;
  }
  function vNetJoin() {
    const d = S.draft, host = d.t[0];
    return `
      <div class="masthead">
        <p class="eyebrow">Game ${esc(NET.code)} · ${esc(qlenLabel(d.qLen))} quarters · audibles ${d.aud !== false ? "on" : "off"}</p>
        <h1>Take on the <em style="color:${host.color}">${esc(host.name)}</em></h1>
        <p class="muted">You'll be the away team. Pick your name and colors.</p>
      </div>
      ${teamCfgHtml(d, 1, { label: "Your team", noCtrl: true, taken: host.color })}
      <button class="btn" data-a="netjoin" ${NET.busy ? "disabled" : ""}>${NET.busy ? "Joining..." : "Join game"}</button>
      <div class="foot"><button class="linkbtn" data-a="netback">Back</button></div>`;
  }
  function vConnecting() {
    return `
      <div class="masthead"><p class="eyebrow">Online game</p><h1>Call Sheet <em>Football</em></h1></div>
      <section class="panel"><p class="muted dots">Connecting to game ${esc(NET.code || "")}</p></section>
      <div class="foot"><button class="linkbtn" data-a="netback">Cancel</button></div>`;
  }
  function vLobby() {
    const [h, g] = S.draft.t, me = NET.me, code = S.online.code;
    const side = (t, where) => t
      ? `<div class="side" style="--team:${t.color}"><div class="at">${where}</div><div class="nm">${esc(t.name)}</div></div>`
      : `<div class="side" style="--team:var(--line)"><div class="at">${where}</div><div class="nm muted dots">Waiting</div></div>`;
    const vs = `<div class="vs">${side(g, "Away")}<span class="at">at</span>${side(h, "Home")}</div>`;
    let body;
    if (me === 0 && !g) body = `
      <section class="panel">
        <p class="eyebrow">Game code</p>
        <div class="bigcode">${esc(code)}</div>
        <p>Send your friend the invite link. They'll pick their team and join, then you kick off.</p>
        <button class="btn" data-a="netshare">${NET.copied ? "Link copied" : "Send invite link"}</button>
        <p class="linkline">${esc(inviteLink(code))}</p>
      </section>${vs}`;
    else if (me === 0) body = `${vs}
      <section class="panel"><p><b>${esc(g.name)}</b> are in. ${esc(qlenLabel(S.draft.qLen))} quarters, audibles ${S.draft.aud !== false ? "on" : "off"}.</p>
      <button class="btn" data-a="kickoff">Kick off</button></section>`;
    else body = `${vs}
      <section class="panel"><p class="muted dots">You're in. Waiting for ${esc(h.name)} to kick off</p></section>`;
    return `
      <div class="masthead"><p class="eyebrow">Online game · ${esc(code)}</p><h1>Call Sheet <em>Football</em></h1></div>
      ${body}
      <div class="foot"><button class="linkbtn" data-a="netleave">Leave game</button></div>`;
  }
  function vWait() {
    const who = actor(), tm = S.teams[who], o = S.poss;
    let eyebrow = S.twoPt ? "Two-point try" : `${downText()} at the ${spotText(o, S.spot)}`, msg = "", mine = "";
    switch (S.phase) {
      case "call":
        if (S.side === "off") msg = `${tm.name} are calling their play. You'll call your defense next.`;
        else {
          msg = `${tm.name} are calling their defense.`;
          if (NET.me === o) mine = `<div class="mycall" style="--team:${S.teams[o].color}"><span class="eyebrow">Your call · ${OFF_PKGS[S.offPkg] ? OFF_PKGS[S.offPkg].short : ""}</span><span class="nm">${esc(callName(S.offCall))}</span></div>`;
        }
        break;
      case "los": msg = `${tm.name} are reading your defense at the line and may audible.`;
        if (NET.me === 1 - o && S.defCall) mine = `<div class="mycall" style="--team:${S.teams[1 - o].color}"><span class="eyebrow">Your call · ${DEF_PKGS[S.defPkg] ? DEF_PKGS[S.defPkg].short : ""}</span><span class="nm">${esc(callName(S.defCall))}</span></div>`;
        break;
      case "pat": eyebrow = "Point after"; msg = `${tm.name} are deciding: kick the extra point or go for two.`; break;
      case "trychoice": eyebrow = "Point after"; msg = `${tm.name} are deciding: go for two again or kick it.`; break;
      case "kickchoice": eyebrow = "Kickoff"; msg = `${tm.name} are deciding whether to kick deep or try an onside kick.`; break;
      case "toss": eyebrow = S.toss.ot ? "Overtime coin toss" : "Coin toss";
        msg = S.toss.step === "call" ? `${tm.name} are calling heads or tails.` : `${name(VISITOR)} called ${S.toss.call}. It's ${S.toss.flip}, so ${tm.name} win the toss and are deciding ${S.toss.ot ? "whether to receive or kick" : "whether to receive or defer"}.`; break;
      case "penalty": eyebrow = "Flag on the play"; msg = `${PEN[S.pen.code] ? PEN[S.pen.code].name + ". " : ""}${tm.name} are deciding whether to accept the penalty.`; break;
    }
    return `${board()}
      ${S.phase === "call" ? bannerHtml() : ""}
      <section class="panel handoff" style="--team:${tm.color}">
        <p class="eyebrow">${esc(eyebrow)}</p>
        <h2>Waiting on the <span>${esc(tm.name)}</span></h2>
        <p class="muted">${esc(msg)}</p>
      </section>
      ${mine}
      ${S.phase === "toss" ? "" : liveField()}`;
  }
  function netResultButton(label) {
    if (!NET.live) return `<button class="btn" data-a="cont">${label}</button>`;
    if (NET.me < 0) return "";
    const rd = S.ready && S.last && S.ready.id === S.last.id ? S.ready.who : [false, false], other = 1 - NET.me;
    if (rd[NET.me]) return `<button class="btn" disabled>Waiting for ${esc(name(other))}</button>`;
    return `${rd[other] ? `<p class="muted" style="font-size:14px">${esc(name(other))} are ready.</p>` : ""}<button class="btn" data-a="cont">${label}</button>`;
  }

  /* ---------- Events ---------- */
  let endTimer = null;
  function act(a, ds) {
    const pre = preSnap(a);
    if (a === "mute") { const on = Sound.toggle(); render(); if (on) Sound.play([["whistle", 0, .25]]); return; }
    if (a.startsWith("net")) { netAct(a); return; }
    if (NET.live && !netCan(a, ds)) return;
    const online = NET.live ? S.online : null;
    const toLobby = () => ({ v: 1, phase: "lobby", draft: JSON.parse(JSON.stringify(S.cfg)), online });
    switch (a) {
      case "color": S.draft.t[+ds.t].color = ds.c; break;
      case "ctrl": S.draft.t[+ds.t].cpu = ds.v === "1"; break;
      case "qlen": S.draft.qLen = +ds.v; break;
      case "kickoff": { const draft = S.draft; initGame(draft); if (online) S.online = online; else S.lastDraft = draft; window.scrollTo(0, 0); break; }
      case "reveal": S.phase = S.side === "aud" ? "los" : "call"; window.scrollTo(0, 0); break;
      case "aud": S.draft.aud = ds.v === "1"; break;
      case "audpick": if (S.phase === "los") S.audSel = S.audSel === ds.v ? null : ds.v; break;
      case "audible": if (S.phase === "los") { audible(S.audSel); window.scrollTo(0, 0); } break;
      case "snap": if (S.phase === "los") { audible(null); window.scrollTo(0, 0); } break;
      case "pick": S.sel = ds.v; break;
      case "pkg": if (S.nhLock) break; S.pkgSel = ds.v; if (S.sel === "te" && ds.v !== "jumbo") S.sel = null; break;
      case "lock": lock(); window.scrollTo(0, 0); break;
      case "cont": { const id = S.last && S.last.id; if (online) netReadyTap(); else cont(); if (!online || S.phase !== "result" || (S.last && S.last.id) !== id) window.scrollTo(0, 0); break; }
      case "pat": doPAT(ds.v); break;
      case "kick": if (S.phase === "kickchoice") { doKickChoice(ds.v); window.scrollTo(0, 0); } break;
      case "toss": if (S.phase === "toss" && S.toss) { if (S.toss.step === "call") tossCall(ds.v); else tossChoose(ds.v); tossNext(); window.scrollTo(0, 0); } break;
      case "try": { const c = S.tryChoice; if (!c) break; S.tryChoice = null; S.patTeam = c.team; if (ds.v === "two") startTwo(c.spot); else doPAT("kick", xpDist(c.spot)); window.scrollTo(0, 0); break; }
      case "pen": choosePenalty(ds.v === "1"); window.scrollTo(0, 0); break;
      case "to": callTimeout(+ds.t); break;
      case "spike": if (S.clockRunning && S.down <= 3) { S.spikeNext = !S.spikeNext; if (S.spikeNext) S.noHuddle = false; } break;
      case "nohuddle": if (nhAvailable()) { S.noHuddle = !S.noHuddle; if (S.noHuddle) S.spikeNext = false; } break;
      case "rematch": { const cfg = JSON.parse(JSON.stringify(S.cfg)); initGame(cfg); if (online) S.online = online; window.scrollTo(0, 0); break; }
      case "newsetup": S = { v: 1, phase: "setup", draft: JSON.parse(JSON.stringify(S.cfg)) }; break;
      case "end":
        if (S.confirmEnd) { S = online ? toLobby() : { v: 1, phase: "setup", draft: JSON.parse(JSON.stringify(S.cfg)) }; }
        else { S.confirmEnd = true; clearTimeout(endTimer); endTimer = setTimeout(() => { if (S.confirmEnd) { S.confirmEnd = false; render(); } }, 3500); }
        break;
      default: return;
    }
    if (a !== "end") S.confirmEnd = false;
    if (online && NET_COMMIT.has(a) && !(a === "end" && S.confirmEnd)) netPush(a);
    else save();
    render();
    Sound.play(cuesFor(a, pre));
  }

  function start(data) {
    S = (data && data.state) || loadSaved() || { v: 1, phase: "setup", draft: defaultDraft() };
    if (S.phase === "setup" && !S.draft) S.draft = defaultDraft();
    // An invite link (?g=CODE) opens straight into that online game
    let code = null;
    try { code = new URLSearchParams(location.search).get("g"); } catch (e) {}
    if (code && netReady()) { if (S.phase !== "setup") S = { v: 1, phase: "setup", draft: S.cfg ? JSON.parse(JSON.stringify(S.cfg)) : defaultDraft() }; netConnect(code); return; }
    if (S.teams && !S.tos) { S.tos = S.quarter >= 5 ? [2, 2] : [3, 3]; S.clockRunning = false; }
    render();
  }

  if (typeof document !== "undefined") {
    document.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (b) act(b.dataset.a, b.dataset); });
    document.addEventListener("input", e => { const el = e.target; if (el.matches && el.matches("input[data-t]") && S.draft) { S.draft.t[+el.dataset.t].name = el.value; save(); } });
    window.claude?.hot?.snapshot?.(() => ({ state: S }));
    window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
  } else {
    // Headless test hook
    globalThis.__sim = { initGame, cont, cuesFor, act, netAct, netConnect, actor, NET, DEVICE, kneelAvailable, puntAvailable, fgAvailable, get S() { return S; }, set S(v) { S = v; } };
  }
})();
</script>

</body></html>
